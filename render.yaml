services:
  - type: web
    name: tatvivah-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRISMA_LOG_QUERIES
        value: "false"
      - key: BACKEND_PUBLIC_URL
        sync: false
      # Self-ping keeps the instance from idling out. Render free services spin
      # down after ~15 minutes without inbound traffic, and the next visitor then
      # waits ~50s for a cold start — the single largest source of slow page
      # loads. The ping code already existed but never ran because this URL was
      # unset. Must be the service's own PUBLIC url, not localhost, or it does
      # not count as inbound traffic.
      - key: BACKEND_WARMUP_URL
        sync: false
      - key: BACKEND_WARMUP_INTERVAL_MS
        value: "240000"
      # PhonePe PG (Standard Checkout v2). Secrets set in the Render dashboard.
      - key: PHONEPE_ENV
        value: PRODUCTION
      - key: PHONEPE_CLIENT_VERSION
        value: "1"
      - key: PHONEPE_CLIENT_ID
        sync: false
      - key: PHONEPE_CLIENT_SECRET
        sync: false
      - key: PHONEPE_WEBHOOK_USERNAME
        sync: false
      - key: PHONEPE_WEBHOOK_PASSWORD
        sync: false
      # Where PhonePe returns the buyer once they have paid. Neither of these was
      # declared here, so both fell back to FRONTEND_BASE_URL — and locally
      # PHONEPE_WEB_REDIRECT_BASE_URL is set to http://localhost:3001, which takes
      # precedence over it. If that dev value is ever set on the service, every
      # buyer is handed to a dead page on their own phone after paying.
      #
      # WEB: must be the public storefront origin, e.g.
      #   https://www.tatvivahtrends.com
      # The backend now refuses loopback and private hosts here regardless.
      - key: PHONEPE_WEB_REDIRECT_BASE_URL
        sync: false
      # MOBILE: LEAVE THIS UNSET.
      #
      # It must be an https URL if set at all. PhonePe validates
      # merchantUrls.redirectUrl and rejects custom app schemes, so a deep link
      # like `mobile://checkout` makes checkout fail on PhonePe's own domain with
      # a generic "Something went wrong" — after the buyer has already committed.
      #
      # Unset simply reuses the web callback above, which works. Bringing the
      # buyer back into the app should be done by having that https page
      # deep-link onward, not by handing PhonePe a scheme it will not accept.
      - key: PHONEPE_MOBILE_REDIRECT_URL
        sync: false
      # AquaSMS — SMS OTP delivery. Non-secret values are pinned here; the
      # username, API key and DLT ids are set in the Render dashboard.
      #
      # SMS stays OFF until AQUASMS_DLT_PE_ID and AQUASMS_DLT_TEMPLATE_ID are
      # both set, and OTPs fall back to email. That is intentional: without DLT
      # registration the provider bills the message but Indian operators drop
      # it, so users would receive no code at all.
      - key: AQUASMS_BASE_URL
        value: https://login.aquasms.com
      - key: AQUASMS_SMS_TYPE
        value: TRANS
      - key: AQUASMS_TIMEOUT_MS
        value: "20000"
      - key: AQUASMS_ALLOW_NON_DLT
        value: "false"
      - key: AQUASMS_USERNAME
        sync: false
      - key: AQUASMS_API_KEY
        sync: false
      - key: AQUASMS_SENDER_ID
        sync: false
      - key: AQUASMS_DLT_PE_ID
        sync: false
      - key: AQUASMS_DLT_TEMPLATE_ID
        sync: false
      - key: AQUASMS_OTP_TEMPLATE
        sync: false
